name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Probar conexión SSH
      run: sudo ssh -i /root/.ssh/id_ed25519 root@154.12.229.92 "echo 'Conexión exitosa'"
    
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configurar acceso SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
      run: |
        mkdir -p /root/.ssh/
        echo "$SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
        chmod 600 /root/.ssh/id_ed25519
        ssh-keyscan -H 154.12.229.92 >> /root/.ssh/known_hosts

    - name: Ejecutar script de despliegue del backend
      run: |
        ssh -i /root/.ssh/id_ed25519 root@154.12.229.92 'bash /root/deploy-backend.sh'
